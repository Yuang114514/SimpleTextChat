//大肥鱼还是太轮椅了
plugins {
    id 'net.fabricmc.fabric-loom' version "1.17-SNAPSHOT" apply(false)
    id 'maven-publish'
}

group = project.maven_group

allprojects {
    apply plugin: 'java'

    // 全局公共资源目录 (根目录下的 common_resources)
    sourceSets {
        main {
            resources {
                srcDir 'common_resources'
            }
        }
    }
}

subprojects {
    // 1. 只有非 common 模块，才应用 Fabric Loom 和 MC 相关配置
    if (name != 'common') {
        apply plugin: 'net.fabricmc.fabric-loom'

        // 共享 common 目录下的 Java 源码和根目录的资源
        sourceSets {
            main {
                java {
                    srcDirs += project(":").file("common/src/main/java")
                }
                resources {
                    srcDirs += project(':').sourceSets.main.resources.srcDirs
                }
            }
        }

        base {
            archivesName = project(':').archives_base_name
        }
        setVersion(project.mod_version)

        repositories {
            mavenCentral()
            maven {
                name = "Terraformers"
                url = "https://maven.terraformersmc.com/"
            }
        }

        loom {
            splitEnvironmentSourceSets()
            mods {
                "text_chat" {
                    sourceSet sourceSets.main
                    sourceSet sourceSets.client
                }
            }
        }

        dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            implementation "net.fabricmc:fabric-loader:${project.loader_version}"
            implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

            // 注意：Vosk 建议放在 common 模块的 build.gradle 里，但如果你想在这里 include 也行
            include implementation("com.alphacephei:vosk:0.3.45")
            implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
        }

        processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") {
                expand "version": project.version
            }
        }

        // 把之前旧代码里的 jar 打包逻辑加回来
        jar {
            from(project.projectDir) {
                include 'VOSK_LICENSE'
                into 'META-INF'
            }
            from("LICENSE") {
                rename { "${it}_${project.archivesBaseName}" }
            }
        }
    }
}

// 禁用根项目打 jar 包，避免生成无用的空包
tasks.named("jar") {
    enabled = false
}